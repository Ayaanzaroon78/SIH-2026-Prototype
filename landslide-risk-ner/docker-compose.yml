version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: landslide_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: landslide_ner_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: landslide_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/landslide_ner_db
      - SECRET_KEY=sih2026_landslide_ner_secret_key_super_secure
      - RISK_THRESHOLD_MODERATE=25.0
      - RISK_THRESHOLD_HIGH=50.0
      - RISK_THRESHOLD_CRITICAL=75.0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./ml/model_artifacts:/app/ml_artifacts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: landslide_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
